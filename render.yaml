services:
  - type: web
    name: edtech-api
    env: node
    buildCommand: npm install -g pnpm && pnpm install && pnpm build --filter api
    startCommand: cd apps/api && pnpm start:prod
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
